<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Officials on Record · Public statements on UAP</title>
<meta name="description" content="Eighty public statements from presidents, senators, intelligence directors, generals, and military pilots on unidentified anomalous phenomena.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e1518;
    --bg-raised: #141c1f;
    --ink: #e8e2da;
    --ink-soft: #b5ada3;
    --muted: #7d756b;
    --faint: #4a4640;
    --accent: #c4a882;
    --accent-dim: #7a6a54;
    --rule: #2a3438;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'EB Garamond', Georgia, serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body { display: flex; flex-direction: column; }

  /* ── MASTHEAD ── */
  .masthead {
    padding: 22px 48px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--rule);
    flex-shrink: 0;
  }

  .masthead-logo {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-soft);
    text-decoration: none;
  }

  .masthead-logo:hover { color: var(--accent); }

  .masthead-nav {
    display: flex;
    gap: 32px;
    list-style: none;
  }

  .masthead-nav a {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.2s;
  }

  .masthead-nav a:hover { color: var(--accent); }
  .masthead-nav a.active { color: var(--ink-soft); }

  /* ── STAGE ── */
  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 80px 48px;
    width: 100%;
  }

  .quote-eyebrow {
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 40px;
    text-align: center;
  }

  blockquote.quote-text {
    font-family: 'EB Garamond', Georgia, serif;
    font-style: italic;
    font-size: clamp(22px, 3.2vw, 34px);
    line-height: 1.55;
    font-weight: 400;
    letter-spacing: 0;
    color: var(--ink);
    margin-bottom: 48px;
    max-width: 700px;
    text-align: center;
    transition: opacity 0.3s ease;
  }

  blockquote.quote-text.long {
    font-size: clamp(20px, 2.8vw, 30px);
    line-height: 1.5;
    max-width: 720px;
  }

  blockquote.quote-text.very-long {
    font-size: clamp(18px, 2.2vw, 24px);
    line-height: 1.55;
    max-width: 760px;
  }

  blockquote.quote-text.fade { opacity: 0; }

  .rule {
    width: 40px;
    height: 1px;
    background: var(--rule);
    margin: 0 auto 32px;
  }

  .meta {
    text-align: center;
    margin-bottom: 64px;
    transition: opacity 0.3s ease;
  }

  .meta.fade { opacity: 0; }

  .attribution {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink);
    margin-bottom: 8px;
  }

  .credential {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 16px;
    font-style: italic;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }

  .date {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 24px;
  }

  .source-link {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent-dim);
    text-decoration: none;
    border-bottom: 1px solid var(--accent-dim);
    padding-bottom: 2px;
    transition: color 0.2s, border-color 0.2s;
  }

  .source-link:hover {
    color: var(--accent);
    border-color: var(--accent);
  }

  /* ── CONTROLS ── */
  .controls {
    display: flex;
    align-items: center;
    gap: 32px;
  }

  .nav-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    padding: 8px 4px;
    cursor: pointer;
    transition: color 0.2s;
  }

  .nav-btn:hover:not(:disabled) { color: var(--accent); }
  .nav-btn:disabled { opacity: 0.25; cursor: default; }

  .progress {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--muted);
  }

  .progress span { color: var(--accent-dim); }

  /* ── FOOTER ── */
  .footer {
    border-top: 1px solid var(--rule);
    padding: 18px 48px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }

  .footer-text {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--muted);
  }

  .footer-link {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent-dim);
    text-decoration: none;
    border-bottom: 1px solid var(--accent-dim);
    padding-bottom: 2px;
  }

  .footer-link:hover { color: var(--accent); border-color: var(--accent); }

  @media (max-width: 768px) {
    .masthead { padding: 16px 24px; flex-wrap: wrap; gap: 12px; }
    .masthead-nav { gap: 20px; }
    .stage { padding: 48px 24px; }
    .controls { gap: 20px; }
    .footer { padding: 16px 24px; flex-direction: column; gap: 12px; }
  }
</style>
</head>
<body>

<header class="masthead">
  <a href="/" class="masthead-logo">Officials on Record</a>
  <nav>
    <ul class="masthead-nav">
      <li><a href="/" class="active">Statements</a></li>
      <li><a href="/essay/">Essay</a></li>
      <li><a href="/reading/">Further Reading</a></li>
      <li><a href="/essay/#method">About</a></li>
    </ul>
  </nav>
</header>

<main class="stage">
  <div class="quote-eyebrow" id="eyebrow"></div>
  <blockquote class="quote-text" id="quote-text"></blockquote>
  <div class="rule"></div>
  <div class="meta" id="meta">
    <div class="attribution" id="attr-name"></div>
    <div class="credential" id="attr-role"></div>
    <div class="date" id="attr-date"></div>
    <a class="source-link" id="attr-source" target="_blank" rel="noopener">Verify</a>
  </div>

  <nav class="controls">
    <button class="nav-btn" id="prev-btn" onclick="navigate(-1)">← Prev</button>
    <span class="progress"><span id="current-num">1</span> / <span id="total-num">10</span></span>
    <button class="nav-btn" id="next-btn" onclick="navigate(1)">Next →</button>
  </nav>
</main>

<footer class="footer">
  <span class="footer-text">Public statements on unidentified anomalous phenomena</span>
  <a href="/essay/" class="footer-link">Read the essay →</a>
</footer>

<script>
const quotes = [
  {
    eyebrow: "Former US President",
    text: "I think it's time to open the books on questions that the American people have been asking for decades. What do our governments know? Let's find out.",
    name: "Bill Clinton",
    role: "42nd President of the United States",
    date: "2014",
    source: "https://www.youtube.com/watch?v=bVg5xLNPbOI"
  },
  {
    eyebrow: "Former Head, Israeli Space Security",
    text: "We now know that we are not alone.",
    name: "Haim Eshed",
    role: "Former Head of Israel's Space Security Program",
    date: "December 2020",
    source: "https://www.jpost.com/omg/former-israeli-space-security-chief-says-extraterrestrials-exist-and-trump-knows-651405"
  },
  {
    eyebrow: "US Senator",
    text: "There are a lot more sightings than have been made public. Some of these things have been reported at a very high level of credibility.",
    name: "John McCain",
    role: "Chairman, Senate Armed Services Committee",
    date: "2017",
    source: ""
  },
  {
    eyebrow: "Sworn Testimony",
    text: "I'm not saying it's extraterrestrial. But I am saying that whatever it is, it demonstrates capabilities not yet seen in any US system, and not in any foreign system we know of.",
    name: "David Fravor",
    role: "Commander, US Navy (Ret.), Nimitz Incident Pilot",
    date: "Congressional testimony, July 2023",
    source: "https://www.govinfo.gov/content/pkg/CHRG-118hhrg53022/pdf/CHRG-118hhrg53022.pdf"
  },
  {
    eyebrow: "US Senator",
    text: "These objects, we don't know what they are, we can't explain them, sailors and pilots are reporting them. That's a national security problem.",
    name: "Marco Rubio",
    role: "Vice Chair, Senate Select Committee on Intelligence",
    date: "May 2021",
    source: "https://www.cbsnews.com/news/ufo-sightings-military-videos-60-minutes-2021-05-16/"
  },
  {
    eyebrow: "US Senator",
    text: "I was told for years that there was no such thing as a UAP task force. I'm now being told there is. I was told there was no such thing as a program. I'm now being told there was.",
    name: "Kirsten Gillibrand",
    role: "Member, Senate Armed Services Committee",
    date: "Senate Hearing, 2022",
    source: ""
  },
  {
    eyebrow: "Sworn Testimony",
    text: "I've been informed, in the course of my official duties, of a multi-decade UAP crash retrieval and reverse-engineering program to which I was denied access.",
    name: "David Grusch",
    role: "Former NRO Officer, UAP Task Force",
    date: "Congressional testimony, July 2023",
    source: "https://www.govinfo.gov/content/pkg/CHRG-118hhrg53022/pdf/CHRG-118hhrg53022.pdf"
  },
  {
    eyebrow: "US Navy Spokesman",
    text: "The objects observed by Navy personnel appeared to remain stationary in high altitude winds, with no visible means of propulsion, and performed maneuvers that are not currently within the US inventory.",
    name: "Joseph Gradisher",
    role: "Spokesman, Deputy Chief of Naval Operations for Information Warfare",
    date: "September 2019",
    source: "https://www.theblackvault.com/documentarchive/the-u-s-navy-statement-on-ufo-videos/"
  },
  {
    eyebrow: "Former Director of the CIA",
    text: "I think some of it probably is real. I would not rule out that there might be something out there that we simply don't understand and can't explain.",
    name: "John Brennan",
    role: "Director, Central Intelligence Agency, 2013–2017",
    date: "December 2020",
    source: "https://medium.com/conversations-with-tyler/john-brennan-tyler-cowen-transcript-ufo-c06c8b24cf3c"
  },
  {
    eyebrow: "Former US President",
    text: "There's footage and records of objects in the skies that we don't know exactly what they are. We can't explain how they moved, their trajectory. They did not have an easily explainable pattern.",
    name: "Barack Obama",
    role: "44th President of the United States",
    date: "May 2021",
    source: "https://www.youtube.com/watch?v=EPoH1ARoRrs"
  }
];

let current = 0;

function setSizeClass(el, text) {
  el.classList.remove('long', 'very-long');
  if (text.length > 500) el.classList.add('very-long');
  else if (text.length > 250) el.classList.add('long');
}

function render() {
  const q = quotes[current];
  const quoteEl = document.getElementById('quote-text');
  const metaEl = document.getElementById('meta');

  quoteEl.classList.add('fade');
  metaEl.classList.add('fade');

  setTimeout(() => {
    document.getElementById('eyebrow').textContent = q.eyebrow || '';
    quoteEl.textContent = '\u201C' + q.text + '\u201D';
    setSizeClass(quoteEl, q.text);

    document.getElementById('attr-name').textContent = q.name;
    document.getElementById('attr-role').textContent = q.role;
    document.getElementById('attr-date').textContent = q.date;

    const sourceEl = document.getElementById('attr-source');
    if (q.source) {
      sourceEl.href = q.source;
      sourceEl.style.display = 'inline-block';
    } else {
      sourceEl.style.display = 'none';
    }

    document.getElementById('current-num').textContent = current + 1;
    document.getElementById('prev-btn').disabled = current === 0;
    document.getElementById('next-btn').disabled = current === quotes.length - 1;

    quoteEl.classList.remove('fade');
    metaEl.classList.remove('fade');
  }, 200);
}

function navigate(dir) {
  current = Math.max(0, Math.min(quotes.length - 1, current + dir));
  render();
}

document.getElementById('total-num').textContent = quotes.length;

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') navigate(1);
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') navigate(-1);
});

render();
</script>
</body>
</html>
