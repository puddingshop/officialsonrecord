<script>
const screens = [
  { type: 'section', eyebrow: 'One', title: 'Before you decide this isn\u2019t serious.' },

  { type: 'quote', eyebrow: '2020 · US Senate', text: "We have things flying over our military bases and places where we're conducting military exercises, and we don't know what it is, and it isn't ours.", speaker: 'Marco Rubio', credential: 'US Senator', date: 'July 2020', source: 'https://www.youtube.com/watch?v=iBaPSLmx964' },
  { type: 'quote', eyebrow: '2021 · Former US President', text: "There is footage and records of objects in the skies. We don't know exactly what they are. We can't explain how they moved, their trajectory. They did not have an easily explainable pattern.", speaker: 'Barack Obama', credential: '44th President of the United States', date: 'May 2021', source: 'https://www.youtube.com/watch?v=xp6Ph5iTIgc' },
  { type: 'quote', eyebrow: '2020 · CIA Director', text: "I think some of the phenomena we're seeing continues to be unexplained, and might constitute a different form of life.", speaker: 'John Brennan', credential: 'Director of the Central Intelligence Agency', date: 'December 2020', source: 'https://www.youtube.com/watch?v=LdQ7L0ugZJc' },
  { type: 'quote', eyebrow: '2021 · Former Director of National Intelligence', text: "There are a lot more sightings than have been made public. Objects seen by Navy or Air Force pilots, or in satellite imagery, that engage in actions we don't have the technology for, or travel at speeds that exceed the sound barrier without a sonic boom.", speaker: 'John Ratcliffe', credential: 'Director of National Intelligence', date: 'March 2021', source: 'https://www.youtube.com/watch?v=0YEGK56eMvg' },
  { type: 'quote', eyebrow: '2021 · Former Deputy Asst Sec of Defense', text: "It's not us. That's one thing we know. I could say that with very high degree of confidence, in part because of the positions I held in the department.", speaker: 'Christopher Mellon', credential: 'Former Deputy Assistant Secretary of Defense for Intelligence', date: 'May 2021', source: 'https://www.youtube.com/watch?v=ZBtMbBPzqHY' },
  { type: 'quote', eyebrow: '2021 · Former US President', text: "There are things flying around out there that we haven't fully identified yet.", speaker: 'Bill Clinton', credential: '42nd President of the United States', date: 'June 2021', source: 'https://www.youtube.com/watch?v=Y4Pr9Zjxja0' },
  { type: 'quote', eyebrow: '2021 · US Senate', text: "Any time you have legitimate pilots describing something that doesn't seem to conform to the laws of physics that govern aviation and is in US airspace, I think it's something we need to get to the bottom of. I can't imagine that what has been described or shown in some of the videos belongs to any government that I'm aware of.", speaker: 'Martin Heinrich', credential: 'US Senator', date: 'May 2021', source: 'https://futurism.com/the-byte/senator-ufos-earth' },
  { type: 'quote', eyebrow: '2021 · Former Deputy National Security Adviser', text: "That leaves aliens, which we presume it probably is. Although I don't wanna go too far here.", speaker: 'Ben Rhodes', credential: 'Former Deputy National Security Adviser', date: 'June 2021', source: 'https://podcasts.apple.com/ca/podcast/pod-save-the-world/id1200016351' },
  { type: 'quote', eyebrow: '2021 · ODNI Report to Congress', text: "Most of the UAP reported probably do represent physical objects, given that a majority of UAP were registered across multiple sensors, to include radar, infrared, electro-optical, weapon seekers, and visual observation.", speaker: 'Office of the Director of National Intelligence', credential: 'Preliminary Assessment: Unidentified Aerial Phenomena', date: 'June 2021', source: 'https://www.dni.gov/files/ODNI/documents/assessments/Prelimary-Assessment-UAP-20210625.pdf' },
  { type: 'quote', eyebrow: '2021 · US Senate', text: "I don't believe they are coming from foreign adversaries. If they were, that would suggest they have a technology that is in a whole different sphere than anything we understand. And frankly, China and Russia just aren't there, and neither are we, by the way.", speaker: 'Mitt Romney', credential: 'US Senator, former Presidential Nominee', date: 'June 2021', source: 'https://www.cnn.com/videos/politics/2021/06/27/sotu-romney-on-ufos.cnn' },
  { type: 'quote', eyebrow: '2021 · NASA Administrator', text: "We hope it's not an adversary here on Earth that has that kind of technology. But it's something.", speaker: 'Bill Nelson', credential: 'NASA Administrator', date: 'October 2021', source: 'https://www.youtube.com/watch?v=9hH1XEqKlTs' },
  { type: 'quote', eyebrow: '2021 · Director of National Intelligence', text: "There's always the question of: is there something else that we simply do not understand, that might come extraterrestrially?", speaker: 'Avril Haines', credential: 'Director of National Intelligence', date: 'November 2021', source: 'https://www.youtube.com/watch?v=LsgA0-wxmns' },
  { type: 'quote', eyebrow: '2022 · Navy Intelligence · Congressional Hearing', text: "It's clear that the majority, that many of the observations that we have are physical objects from the sensor data. We haven't had a collision. We have had at least eleven near misses.", speaker: 'Scott Bray', credential: 'Deputy Director of Naval Intelligence', date: 'May 2022', source: 'https://www.youtube.com/watch?v=aSDweUbGBow' },
  { type: 'quote', eyebrow: '2022 · US Senate', text: "There are so many of us now on the Intel Committee and Armed Services that we're going to stand by the service members who documented this stuff. They have video. They have radar. They have heat sensors. They have everything.", speaker: 'Kirsten Gillibrand', credential: 'US Senator, Committee on Armed Services', date: 'August 2022', source: 'https://twitter.com/rosscoulthart/status/1563322872428625923' },
  { type: 'quote', eyebrow: '2023 · ODNI Report to Congress', text: "UAP reporting has increased, partially due to a concentrated effort to destigmatize the topic. Whereas there were previously 144 UAP reports covered during the 17 years of UAP reporting included in the ODNI preliminary assessment, there have been 247 more UAP reports during the 17 months since.", speaker: 'Office of the Director of National Intelligence', credential: '2022 Annual Report on Unidentified Aerial Phenomena', date: 'January 2023', source: 'https://www.dni.gov/files/ODNI/documents/assessments/Unclassified-2022-Annual-Report-UAP.pdf' },
  { type: 'quote', eyebrow: '2023 · US Senate', text: "Advanced objects demonstrating advanced technology are routinely flying over our restricted or sensitive airspace, posing a risk to both flight safety and national security.", speaker: 'Marco Rubio', credential: 'US Senator', date: 'February 2023', source: 'https://twitter.com/marcorubio/status/1630533511168794627' },
  { type: 'quote', eyebrow: '2023 · Director AARO · Pentagon', text: "We see these metallic orbs all over the world, and we see these making very interesting apparent maneuvers.", speaker: 'Dr Sean Kirkpatrick', credential: 'Director, All-domain Anomaly Resolution Office', date: 'May 2023', source: 'https://nymag.com/intelligencer/2023/06/5-big-ufo-revelations-from-nasa.html' },
  { type: 'quote', eyebrow: '2023 · Chairman Joint Chiefs of Staff', text: "There is a lot of unidentified aerial phenomena out there. That's true. And they've got pilot reports, there's various other sensors out there, and some of it is difficult to explain. Some are really kind of weird and unexplainable.", speaker: 'General Mark Milley', credential: 'Chairman of the Joint Chiefs of Staff', date: 'August 2023', source: 'https://www.washingtontimes.com/news/2023/aug/6/joint-chiefs-chair-mark-milley-claims-alien-recove/' },
  { type: 'quote', eyebrow: '2024 · Former US President', text: "I have met with pilots. They are not conspiratorial, they are not crazy, and they tell me stories that you wouldn't believe. Am I a believer? No, I can't say I am. But I have met with people, serious people, that say there are some really strange things flying around out there.", speaker: 'Donald Trump', credential: '45th President of the United States', date: 'June 2024', source: 'https://www.newsweek.com/donald-trumps-ufo-admission-raises-eyebrows-1913016' },
  { type: 'quote', eyebrow: '2024 · Former National Security Advisor', text: "There are things that cannot be explained. I don't know what the explanation is for those unexplainable things, but I will say there are phenomena that have been witnessed by multiple people that are just inexplicable by any kind of science, the science available to us.", speaker: 'General H.R. McMaster', credential: 'Former National Security Advisor', date: 'September 2024', source: 'https://x.com/TheUfoJoe/status/1832278471567143162' },
  { type: 'quote', eyebrow: '2024 · Director AARO · Pentagon', text: "There are interesting cases that I — with my physics and engineering background and time in the intelligence community — I do not understand, and I don't know anybody else who understands.", speaker: 'Jon Kosloski', credential: 'Director, All-domain Anomaly Resolution Office', date: 'November 2024', source: 'https://defensescoop.com/2024/11/14/uap-aaro-chief-unveils-pentagon-annual-caseload-analysis-new-efforts/' },

  { type: 'section', eyebrow: 'Two', title: 'Before you decide the pilots are mistaken.' },

  { type: 'quote', eyebrow: '2004 Nimitz · Congressional Testimony', text: "The example that I would say is still unresolved, that I think everyone understands quite well, is the 2004 incident from the USS Nimitz. We have data on that, and it simply remains unresolved.", speaker: 'Scott Bray', credential: 'Deputy Director of Naval Intelligence', date: 'May 2022', source: 'https://www.youtube.com/watch?v=aSDweUbGBow' },
  { type: 'quote', eyebrow: '2004 Nimitz · Reviewing the Case', text: "The most compelling case is the Nimitz case, because you have so many witnesses and so many sensors. There is a lot of different information from a lot of different sources, and the thing is, it is all perfectly congruent. It all hangs together. No one is contradicting someone else's story. What people are seeing is what the sensors are reporting.", speaker: 'Christopher Mellon', credential: 'Former Deputy Assistant Secretary of Defense for Intelligence', date: 'May 2021', source: 'https://www.youtube.com/watch?v=RjV-PZyUwlY' },
  { type: 'quote', eyebrow: '2004 Nimitz · Radar Operator, USS Princeton', text: "At around the evening of November tenth 2004, all these contacts were popping up on my radar right off Catalina Island. At first there were ten or twelve objects. Watching them on the display was like watching snow fall from the sky. 28,000 feet at 100 knots — extremely weird. Usually things that high don't travel that slowly, they'll fall out of the sky.", speaker: 'Kevin Day', credential: 'Senior Chief, US Navy — Lead Radar Operator, USS Princeton', date: '2021', source: 'https://www.amazon.com/UFO-Fleet/dp/B07SH9SB24' },
  { type: 'quote', eyebrow: '2004 Nimitz · Radar Operator, USS Princeton', text: "The Aegis SPY-1 radar eliminated the possibility that it could have been friendly aircraft or enemy aircraft. Nothing really fit. All of a sudden this object drops 28,000 feet down to the surface, and I figured it out later: 0.78 seconds. 24,000 miles per hour. More than thirty times the speed of sound.", speaker: 'Kevin Day', credential: 'Senior Chief, US Navy — Lead Radar Operator, USS Princeton', date: '2021', source: 'https://www.amazon.com/UFO-Fleet/dp/B07SH9SB24' },
  { type: 'quote', eyebrow: '2004 Nimitz · F/A-18 Pilot', text: "Clear blue skies, middle of the day. We were interrupted by a shipborne controller. The tone was urgent. Their requests were unusual. \"This is not an exercise. This is a real-world intercept.\"", speaker: 'Alex Dietrich', credential: 'Lieutenant, US Navy — F/A-18 Pilot', date: '2019', source: 'https://www.amazon.com/UFO-Fleet/dp/B07SH9SB24' },
  { type: 'quote', eyebrow: '2004 Nimitz · F/A-18 Pilot', text: "No windows. No flight surfaces. Smooth. White. No intakes. No smoke trails. It looked like a giant Tic Tac. Maybe 40 feet. Large enough to scare the crap out of me. It was so unnerving because it was so unpredictable. High g-force turns, rapid velocity, rapid acceleration. You're thinking: how can I possibly fight this?", speaker: 'Alex Dietrich', credential: 'Lieutenant, US Navy — F/A-18 Pilot', date: '2019', source: 'https://www.amazon.com/UFO-Fleet/dp/B07SH9SB24' },
  { type: 'quote', eyebrow: '2004 Nimitz · F/A-18 Squadron Commander', text: "It's about 40 feet long. It's white. It has no wings. It has no rotors. It has no control surfaces. Think of a white Tic Tac.", speaker: 'Commander David Fravor', credential: 'US Navy, F/A-18 Pilot — Black Aces Squadron Commander', date: '2019', source: 'https://www.amazon.com/UFO-Fleet/dp/B07SH9SB24' },
  { type: 'quote', eyebrow: '2004 Nimitz · F/A-18 Squadron Commander', text: "This thing would go instantaneous from one way to another, similar to if you threw a ping pong ball against a wall. Now it's mirroring us, it seems to know we are here. It goes from almost a hover to a pretty aggressive climb up to our altitude. Now there is a bit of fear, because you have no idea what it is. It is actually reacting to what we are doing.", speaker: 'Commander David Fravor', credential: 'US Navy, F/A-18 Pilot — Black Aces Squadron Commander', date: '2019', source: 'https://www.amazon.com/UFO-Fleet/dp/B07SH9SB24' },
  { type: 'quote', eyebrow: '2004 Nimitz · Weapons System Officer', text: "It was there, then it rifled out of sight in a split second. It was as if the object was shot out of a rifle. There was no gradual acceleration or spooling up period. It just shot out of sight immediately. I have never seen anything like it before or since. No human could have withstood that kind of acceleration.", speaker: 'Jim Slaight', credential: 'Lt. Commander, US Navy — Weapons System Officer', date: '2021', source: 'https://www.amazon.com/Plain-Sight-investigation-impossible-science/dp/1460759060' },
  { type: 'quote', eyebrow: '2004 Nimitz · F/A-18 Pilot', text: "The thing that stood out to me the most was how erratic it was behaving. Its changes in altitude, airspeed, and aspect were just unlike anything I've ever encountered. Aircraft, whether manned or unmanned, still have to obey the laws of physics. The Tic Tac was not doing that. It was going from 50,000 feet to 100 feet in seconds, which is not possible.", speaker: 'Chad Underwood', credential: 'Lieutenant, US Navy — F/A-18 Pilot', date: '2019', source: 'https://www.amazon.com/Plain-Sight-investigation-impossible-science/dp/1460759060' },

  { type: 'section', eyebrow: 'Three', title: 'Before you decide it is secret American tech.' },

  { type: 'quote', eyebrow: '2021 · House Intelligence Committee Chair', text: "There is something there measurable by multiple instruments, yet it seems to move in directions that are inconsistent with what we know of physics or science more broadly. That to me poses questions of tremendous interest.", speaker: 'Adam Schiff', credential: 'US Congress, Chair House Intelligence Committee', date: 'May 2021', source: 'https://www.youtube.com/watch?v=aSDweUbGBow' },
  { type: 'quote', eyebrow: '2004 Nimitz · F/A-18 Squadron Commander', text: "Nothing accelerates that fast. I doubt that we have developed that technology.", speaker: 'Commander David Fravor', credential: 'US Navy, F/A-18 Pilot', date: 'October 2020', source: 'https://www.amazon.com/Phenomenon-John-Podesta/dp/B08HR9BVNM' },
  { type: 'quote', eyebrow: '2021 · US Senator, Reading the Classified UAP Report', text: "Reading the classified UAP report as a Senator, the hair stood up on the back of my neck. The pilots know they saw something.", speaker: 'Bill Nelson', credential: 'NASA Administrator', date: 'June 2021', source: 'https://www.washingtonpost.com/national-security/ufo-report/2021/06/25/ba323b20-d52c-11eb-ae54-515e2f63d37d_story.html' },
  { type: 'quote', eyebrow: '2021 · ODNI Report to Congress', text: "Some UAP appeared to remain stationary in winds aloft, move against the wind, maneuver abruptly, or move at considerable speed, without discernible means of propulsion. In a small number of cases, military aircraft systems processed radio frequency energy associated with UAP sightings. The Task Force holds a small amount of data that appear to show UAP demonstrating acceleration or a degree of signature management.", speaker: 'Office of the Director of National Intelligence', credential: 'Preliminary Assessment: Unidentified Aerial Phenomena', date: 'June 2021', source: 'https://www.dni.gov/files/ODNI/documents/assessments/Prelimary-Assessment-UAP-20210625.pdf' },
  { type: 'quote', eyebrow: 'Lockheed Skunkworks · Advanced Systems', text: "Hypersonic vehicles that we work on today want to be above 50,000 feet, not down to sea level. You don't see any exhaust plumes, and they would show up in an infrared image. The shape is wrong. The flight regime is wrong. How it flies is wrong.", speaker: 'Steve Justice', credential: 'Former Director, Advanced Systems Development — Skunkworks, Lockheed Martin', date: '2019', source: 'https://www.amazon.com/UFO-Fleet/dp/B07SH9SB24' },
  { type: 'quote', eyebrow: 'US Marines Pilot · Reviewing Pentagon Footage', text: "If this were some type of aircraft with a conventional propulsion system, we would definitely see some type of heat signature. Everything we know about propulsion systems is that they create an intense amount of heat.", speaker: 'Lt. Colonel Christopher Cooke', credential: 'US Marines Pilot', date: '2019', source: 'https://www.amazon.com/UFO-Fleet/dp/B07SH9SB24' },
  { type: 'quote', eyebrow: 'US Navy · F/A-18 Pilot', text: "The fact that the GIMBAL object was just getting himself on his wingtip, at 90 degrees, with no turn, while staying in the exact same point, isn't how aircraft work.", speaker: 'Ryan Graves', credential: 'Lieutenant, US Navy — F/A-18 Pilot', date: '2019', source: 'https://www.amazon.com/UFO-Fleet/dp/B07SH9SB24' },
  { type: 'quote', eyebrow: '2014 Incident · F/A-18 Pilot, US Navy', text: "On a clear, sunny day in April 2014, two F/A-18s took off for an air combat training mission off the coast of Virginia. Just at the moment the two jets crossed the threshold, one of the pilots saw a dark gray cube inside of a clear sphere — motionless against the wind, fixed directly at the entry point. The jets, only 100 feet apart, zipped past the object on either side.", speaker: 'Ryan Graves', credential: 'Lieutenant, US Navy — F/A-18 Pilot', date: 'February 2023', source: 'https://www.politico.com/news/magazine/2023/02/28/ufo-uap-navy-intelligence-00084537' },
  { type: 'quote', eyebrow: '2023 · Former Director of National Intelligence', text: "Objects that demonstrate technologies that seem to defy the laws of physics, and capabilities that we don't have as the world's superpower.", speaker: 'John Ratcliffe', credential: 'Director of National Intelligence', date: 'January 2023', source: 'https://x.com/UAPJames/status/1614644671589892101' },

  { type: 'section', eyebrow: 'Four', title: 'Before you decide this is recent.' },

  { type: 'quote', eyebrow: '1947 · US Air Force', text: "The phenomenon reported is something real and not visionary or fictitious. Extreme rates of climb, maneuverability particularly in roll, and motion which must be considered evasive when sighted or contacted by friendly aircraft and radar, which lend belief to the possibility that some of the objects are controlled either manually or remotely.", speaker: 'Lt. General Nathan Twining', credential: 'Commander of Air Materiel Command, US Air Force', date: 'September 1947', source: 'https://www.documentcloud.org/documents/20797978-twining-memo' },
  { type: 'quote', eyebrow: '1952 · CIA Scientific Intelligence', text: "Sightings of unexplained objects at great altitudes and traveling at high speeds in the vicinity of major US defense installations are of such nature that they are not attributable to natural phenomena or known types of aerial vehicles.", speaker: 'H. Marshall Chadwell', credential: 'Assistant Director, CIA Scientific Intelligence', date: 'December 1952', source: 'https://www.nytimes.com/2019/01/15/arts/television/project-blue-book-history-true-story.html' },
  { type: 'quote', eyebrow: '1960 · First Director of the CIA', text: "Behind the scenes, high-ranking Air Force officers are soberly concerned about the UFOs. But through official secrecy and ridicule, many citizens are led to believe the unknown flying objects are nonsense. To hide the facts, the Air Force has silenced its personnel.", speaker: 'Vice Admiral R.H. Hillenkoetter', credential: 'First Director of the Central Intelligence Agency', date: 'February 1960', source: 'https://timesmachine.nytimes.com/timesmachine/1960/02/28/119097456.pdf' },
  { type: 'quote', eyebrow: '1960 · NATO Allied Air Service', text: "If we persist in refusing to recognize the existence of the UFOs, we will end up, one fine day, by mistaking them for the guided missiles of an enemy, and the worst will be upon us.", speaker: 'General L.M. Chassin', credential: 'NATO Coordinator of Allied Air Service', date: '1960', source: 'http://www.ufoevidence.org/documents/doc598.htm' },
  { type: 'quote', eyebrow: '1957 · Head of US Navy Missile Program', text: "No agency in this country or Russia is able to duplicate at this time the speeds and accelerations which radars and observers indicate the flying objects are able to achieve. There are signs that an intelligence directs these objects because of the way they fly.", speaker: 'Admiral Delmer Fahrney', credential: 'Head of US Navy Guided Missile Program', date: 'January 1957', source: 'https://www.amazon.com/Plain-Sight-investigation-impossible-science/dp/1460759060' },
  { type: 'quote', eyebrow: '1952 Germany · NASA Astronaut, Former Fighter Pilot', text: "At an Air Force base in Germany, 1952. Unlike fighters, they would almost stop in their forward velocity and change 90 degrees. They were round in shape and very metallic looking. They would come over and do the same maneuvers we make, except every once in a while one of them goes zip. You just can't do that in a fighter.", speaker: 'Gordon Cooper', credential: 'NASA Astronaut, US Air Force Fighter Pilot', date: '1998', source: 'https://www.amazon.com/Phenomenon-John-Podesta/dp/B08HR9BVNM' },
  { type: 'quote', eyebrow: '1952 · Commercial & Former Fighter Pilot', text: "There would be no way to make a complete reversal or 90-degree turn at 12,000 miles per hour or greater without making the occupants juice on the wall. Nothing could have gotten to that degree of scientific progress without some of the intermediate steps becoming public knowledge. We just knew that they were not from this planet.", speaker: 'William Nash', credential: 'Pan American Pilot, Former Fighter Pilot', date: 'October 2020', source: 'https://www.amazon.com/Phenomenon-John-Podesta/dp/B08HR9BVNM' },
  { type: 'quote', eyebrow: '1980 Rendlesham · US Air Force Security', text: "I was the senior security officer in charge of Woodbridge base security. I held a top-secret US and NATO security clearance. It maneuvered through the trees and shot off at an unbelievable rate of speed. It was gone in the blink of an eye. In my logbook, which I still have, I wrote: \"Speed impossible.\"", speaker: 'Sergeant James Penniston', credential: 'US Air Force — Rendlesham Forest Incident, 1980', date: '2010', source: 'https://www.amazon.com/UFOs-Generals-Pilots-Government-Officials/dp/0307717089' },
  { type: 'quote', eyebrow: '1980 Rendlesham · UK Chief of Defence Staff', text: "My position, both privately and publicly expressed over the last dozen years or more, is that there are only two possibilities: either an intrusion into our airspace and a landing by unidentified craft took place at Rendlesham as described, or the Deputy Commander of an operational, nuclear-armed US Air Force base in England, and a large number of his enlisted men, are lying. Either of these simply must be of interest to the Ministry of Defence.", speaker: 'Admiral Lord Hill-Norton', credential: 'UK Chief of the Defence Staff', date: 'October 1997', source: 'https://www.amazon.com/UFOs-Generals-Pilots-Government-Officials/dp/0307717089' },
  { type: 'quote', eyebrow: '1997 Phoenix Lights · Governor, Former Pilot', text: "As a pilot and former Air Force officer, I can definitely say that this craft did not resemble any man-made object I'd ever seen. And it was certainly not high-altitude flares, because flares don't fly in formation.", speaker: 'Fife Symington', credential: 'Former Governor of Arizona — Phoenix Lights, 1997', date: '1997', source: 'https://www.amazon.com/Plain-Sight-investigation-impossible-science/dp/1460759060' },
  { type: 'quote', eyebrow: '1947 Washington State · Pilot', text: "I kept looking for their tails. They don't have any tails. I thought, well, something is wrong with my eyes. They seemed to flip and flash in the sun, just like a mirror. I'd be glad to confirm it with my hands on a Bible, because I did see it.", speaker: 'Kenneth Arnold', credential: 'Pilot — The 1947 Sighting That Began Public Awareness', date: '1947', source: 'https://www.amazon.com/Phenomenon-John-Podesta/dp/B08HR9BVNM' },

  { type: 'section', eyebrow: 'Five', title: 'Before you decide it is only an American story.' },

  { type: 'quote', eyebrow: '2021 · Former Director of National Intelligence', text: "All over the world. There have been sightings all over the world.", speaker: 'John Ratcliffe', credential: 'Director of National Intelligence', date: 'March 2021', source: 'https://www.theguardian.com/us-news/2021/mar/22/us-government-ufo-report-sightings' },
  { type: 'quote', eyebrow: '2022 · Navy Intelligence · Congressional Hearing', text: "Allies have seen these. China has created its own version of a UAP task force. A number of countries have seen objects in their airspace that they can't identify.", speaker: 'Scott Bray', credential: 'Deputy Director of Naval Intelligence', date: 'May 2022', source: 'https://www.youtube.com/watch?v=aSDweUbGBow' },
  { type: 'quote', eyebrow: 'France · 21 Years Heading the National UAP Program', text: "For twenty-one years, from 1983 to 2004, I was the director of the French program to investigate and analyze unidentified aerospace phenomena. The existence of UFOs is without question. Their physical characteristics can be measured by our detection systems, particularly radar. They display a physics seemingly far different from that which we employ in our most technologically advanced countries.", speaker: 'Jean-Jacques Velasco', credential: 'Former Director, GEPAN — French Government UAP Program', date: '2010', source: 'https://www.amazon.com/UFOs-Generals-Pilots-Government-Officials/dp/0307717089' },
  { type: 'quote', eyebrow: '1999 · Declassified French Government Report', text: "In ten of the eleven cases investigated, the conclusion was that the witnesses had witnessed a material phenomenon that could not be explained as a natural phenomenon or a human device. Behind the overall phenomenon there is a flying machine whose modes of sustenance and propulsion are beyond our knowledge.", speaker: 'National Security Agency', credential: 'Declassified Summary of GEPAN Report — French Government', date: '1999', source: 'https://www.nsa.gov/portals/75/documents/news-features/declassified-documents/ufo/french_gov_ufo_study.pdf' },
  { type: 'quote', eyebrow: '1989-90 Belgium · Deputy Chief of Staff, Air Force', text: "Hundreds of people saw a majestic triangular craft with a span of approximately 120 feet, powerful beaming spotlights, moving very slowly without making any significant noise, but, in several cases, accelerating to very high speeds. On one occasion, two F-16s registered changes in speed and altitude which were well outside the performance envelope of existing aircraft.", speaker: 'Major General Wilfred De Brouwer', credential: 'Deputy Chief of Staff, Belgian Air Force', date: '2010', source: 'https://www.amazon.com/Plain-Sight-investigation-impossible-science/dp/1460759060' },
  { type: 'quote', eyebrow: '1989-90 Belgium · Deputy Chief of Staff, Air Force', text: "The crafts performed in ways not possible by known technology. They were able to remain stationary and hover, even in unusual positions such as vertical and banking at 45 degrees or more. They could fly at slow speeds and accelerate extremely fast, faster than any known aircraft, and they remained silent, even when hovering or accelerating.", speaker: 'Major General Wilfred De Brouwer', credential: 'Deputy Chief of Staff, Belgian Air Force', date: '2010', source: 'https://www.amazon.com/UFOs-Generals-Pilots-Government-Officials/dp/0307717089' },
  { type: 'quote', eyebrow: '1980 Peru · Air Force Intercept', text: "I shot a burst of sixty-four 30mm shells, which created a cone-shaped wall of fire that would normally obliterate anything in its path. But nothing happened. I was startled to see that the balloon was not a balloon at all. It was an object that measured about 35 feet in diameter. It had no wings, propulsion jets, exhausts, windows, or antennae. It had no visible propulsion system. I realized this was not a spying device but a UFO, something totally unknown.", speaker: 'Comandante Oscar Santa Maria Huertas', credential: 'Peruvian Air Force — 1980 Intercept', date: '2010', source: 'https://www.amazon.com/UFOs-Generals-Pilots-Government-Officials/dp/0307717089' },
  { type: 'quote', eyebrow: '1982 Portugal · Air Force', text: "It didn't have wings and it didn't have a tail, only a cockpit. It was an oval shape. It came toward me and flew right over me, on top of my aircraft, and stopped there, like a helicopter landing but much, much faster, breaking all the rules of aerodynamics. It was very close to my plane, only about 15 feet. It then flew off in a flash. Right after landing, all three of us filed detailed, independent written reports.", speaker: 'Captain Julio Miguel Guerra', credential: 'Portuguese Air Force', date: '2010', source: 'https://www.amazon.com/UFOs-Generals-Pilots-Government-Officials/dp/0307717089' },
  { type: 'quote', eyebrow: '1976 Tehran · US Defense Intelligence Agency', text: "An outstanding report: this 1976 Tehran case is a classic which meets all the criteria necessary for a valid study of the UFO phenomenon. The object was seen by multiple witnesses from different locations. The credibility of many of the witnesses was high — an Air Force General, qualified aircrews, and experienced tower operators. Visual sightings were confirmed by radar. Similar electromagnetic effects were reported by three separate aircraft.", speaker: 'Major Colonel Roland Evans', credential: 'Defense Intelligence Agency', date: 'October 1976', source: 'https://www.amazon.com/UFOs-Generals-Pilots-Government-Officials/dp/0307717089' },
  { type: 'quote', eyebrow: '1976 Tehran · Iranian Air Force', text: "All of a sudden it jumped about 10 degrees to the right, in an instant. 6.7 miles. Then it jumped 10 degrees again. I thought this was my chance to fire at it. But suddenly, nothing was working. The weapons control panel was out, and I lost all the instruments, and the radio. The indicator dials were spinning around randomly. The UAP started circling around us.", speaker: 'General Parviz Jafari', credential: 'Iranian Air Force — 1976 Tehran Incident', date: '2010', source: 'https://www.amazon.com/UFOs-Generals-Pilots-Government-Officials/dp/0307717089' },

  { type: 'section', eyebrow: 'Six', title: 'Before you decide you have seen the evidence.' },

  { type: 'quote', eyebrow: '2020 · Former US Senate Majority Leader', text: "I'm glad the Pentagon is finally releasing this footage, but it only scratches the surface of research and materials available.", speaker: 'Harry Reid', credential: 'Former US Senate Majority Leader', date: 'April 2020', source: 'https://twitter.com/SenatorReid/status/1254836730546384897' },
  { type: 'quote', eyebrow: '2021 · Former US Senate Majority Leader', text: "I am saying most of the evidence hasn't seen the light of day.", speaker: 'Harry Reid', credential: 'Former US Senate Majority Leader', date: 'May 2021', source: 'https://www.amazon.com/Phenomenon-John-Podesta/dp/B08HR9BVNM' },
  { type: 'quote', eyebrow: '2021 · Former Director of National Intelligence', text: "I actually wanted to get this information out and declassify it before I left office, but we weren't able to get it down into an unclassified format that we were able to talk about quickly enough.", speaker: 'John Ratcliffe', credential: 'Director of National Intelligence', date: 'March 2021', source: 'https://www.theguardian.com/us-news/2021/mar/22/us-government-ufo-report-sightings' },
  { type: 'quote', eyebrow: '2015 · Former White House Chief of Staff', text: "Finally, my biggest failure of 2014: once again not securing the disclosure of UFO files.", speaker: 'John Podesta', credential: 'Former Chief of Staff to President Clinton', date: 'February 2015', source: 'https://twitter.com' },
  { type: 'quote', eyebrow: '2014 · Former US President · On Classified Files', text: "I did attempt to discover if there were any secret government documents that reveal things, and if there were, they were concealed from me too. I wouldn't be the first president that underlings had lied to or career bureaucrats have waited out. There may be some career person sitting around somewhere hiding these dark secrets even from elected presidents.", speaker: 'Bill Clinton', credential: '42nd President of the United States', date: '2014', source: 'https://www.amazon.com/Phenomenon-John-Podesta/dp/B08HR9BVNM' },
  { type: 'quote', eyebrow: '2021 · Former Deputy Asst Sec of Defense', text: "If there is some recovered debris, it is so deeply buried and squirreled away that it's outside of those normal oversight processes. And that's why there is a problem in this area.", speaker: 'Christopher Mellon', credential: 'Former Deputy Assistant Secretary of Defense for Intelligence', date: 'May 2021', source: 'https://www.amazon.com/Phenomenon-John-Podesta/dp/B08HR9BVNM' },
  { type: 'quote', eyebrow: '2024 · FBI Director', text: "What the Deep State uses the most to cover up their corruption is an illegal application of the classification system. You need a 24/7 declassification office.", speaker: 'Kash Patel', credential: 'FBI Director', date: 'September 2024', source: 'https://x.com/UAPJames/status/1863009959379652951' },

  { type: 'section', eyebrow: 'Seven', title: 'One more thing, before you decide nobody credible has said it.' },

  { type: 'quote', eyebrow: 'Sworn Testimony to US Congress', text: "In 2019, the UAP Task Force director tasked me to identify all Special Access Programs and Controlled Access Programs we needed to satisfy our congressionally mandated mission. At the time, due to my extensive executive-level intelligence support duties, I was cleared to literally all relevant compartments. I was informed, in the course of my official duties, of a multi-decade UAP crash retrieval and reverse engineering program to which I was denied access. I made the decision to report this information to my superiors and multiple Inspectors General, and in effect become a whistleblower.", speaker: 'David Grusch', credential: 'Former National Geospatial Intelligence Agency Officer — Sworn Testimony to Congress', date: 'July 2023', source: 'https://oversight.house.gov/wp-content/uploads/2023/07/Dave_G_HOC_Speech_FINAL_For_Trans.pdf' },
  { type: 'quote', eyebrow: '2020 · Former US Senate Majority Leader', text: "After looking into this, I came to the conclusion that there were reports — some substantive, some not so substantive — that there were actual UAP materials that the government and the private sector had in their possession. It is extremely important that information about the discovery of physical materials or retrieved craft come out.", speaker: 'Harry Reid', credential: 'Former US Senate Majority Leader', date: 'July 2020', source: 'https://www.nytimes.com/2020/07/23/us/politics/pentagon-ufo-harry-reid-navy.html' },

const stage = document.getElementById('stage');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const progress = document.getElementById('progress');

let index = 0;

function render() {
  const s = screens[index];
  stage.classList.remove('visible');

  setTimeout(() => {
    stage.innerHTML = '';

    if (s.type === 'intro') {
      stage.innerHTML = `
        <div class="screen-inner">
          ${s.eyebrow ? `<div class="intro-eyebrow">${s.eyebrow}</div>` : ''}
          <h1 class="intro-title">${s.title}</h1>
          <p class="intro-sub">${s.sub}</p>
          <button class="start-btn" id="start-btn-el">${s.cta}</button>
        </div>
      `;
      document.getElementById('start-btn-el').addEventListener('click', next);
    } else if (s.type === 'section') {
      stage.innerHTML = `
        <div class="screen-inner">
          <div class="section-frame">
            <div class="section-eyebrow">Chapter ${s.eyebrow}</div>
            <h2 class="section-title">${s.title}</h2>
          </div>
        </div>
      `;
    } else if (s.type === 'quote') {
      const len = s.text.length;
      let sizeClass = '';
      if (len > 500) sizeClass = 'very-long';
      else if (len > 250) sizeClass = 'long';
      else if (len > 120) sizeClass = 'medium';
      stage.innerHTML = `
        <div class="screen-inner">
          ${s.eyebrow ? `<div class="quote-eyebrow">${s.eyebrow}</div>` : ''}
          <blockquote class="quote-text ${sizeClass}">&ldquo;${s.text}&rdquo;</blockquote>
          <div class="rule"></div>
          <div class="attribution">${s.speaker}</div>
          <div class="credential">${s.credential}</div>
          <div class="date">${s.date}</div>
          <a class="source-link" href="${s.source}" target="_blank" rel="noopener">Verify</a>
        </div>
      `;
    } else if (s.type === 'closing') {
      stage.innerHTML = `
        <div class="screen-inner">
          <p class="closing-text">${s.text}</p>
          <p class="closing-sub">${s.sub}</p>
          <div class="closing-links">
            <a class="closing-link" href="${s.linkUrl}" target="_blank" rel="noopener">${s.linkText}</a>
            <a class="closing-link" href="${s.readingUrl}">${s.readingText}<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"/><path d="M9 7h8v8"/></svg></a>
          </div>
        </div>
      `;
    }

    stage.classList.add('visible');
    updateControls();
    window.scrollTo(0, 0);
  }, 250);
}

function updateControls() {
  const s = screens[index];
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === screens.length - 1;

  if (s.type === 'quote') {
    const quoteScreens = screens.filter(x => x.type === 'quote');
    const currentQuoteIndex = screens.slice(0, index + 1).filter(x => x.type === 'quote').length;
    progress.textContent = `${currentQuoteIndex} / ${quoteScreens.length}`;
    progress.classList.add('visible');
  } else {
    progress.classList.remove('visible');
    progress.textContent = '';
  }

  // Pulse the Next button only on the first screen
  if (index === 0) nextBtn.classList.add('pulse');
  else nextBtn.classList.remove('pulse');

  updateRail();
}

function next() {
  if (index < screens.length - 1) { index++; render(); }
}

function prev() {
  if (index > 0) { index--; render(); }
}

prevBtn.addEventListener('click', prev);
nextBtn.addEventListener('click', next);

// --- Side rail (chapter map) ---
const sideRail = document.getElementById('side-rail');

// Find indices of each section (chapter) screen
const chapterIndices = screens
  .map((s, i) => (s.type === 'section' ? i : -1))
  .filter(i => i !== -1);

// Build the dots once
function buildRail() {
  sideRail.innerHTML = '';
  chapterIndices.forEach((screenIdx, chapterNum) => {
    const s = screens[screenIdx];
    const wrap = document.createElement('button');
    wrap.className = 'dot-wrap';
    wrap.dataset.index = screenIdx;
    wrap.setAttribute('aria-label', `Jump to Chapter ${s.eyebrow}: ${s.title}`);
    wrap.innerHTML = `
      <span class="dot"></span>
      <span class="dot-tooltip">${s.title.replace(/\.$/, '')}</span>
    `;
    wrap.addEventListener('click', () => {
      index = screenIdx;
      render();
    });
    sideRail.appendChild(wrap);
  });
}

// Figure out which chapter the current screen belongs to
function currentChapter() {
  // The current chapter is the largest chapter-start index <= index
  let current = 0;
  for (let i = 0; i < chapterIndices.length; i++) {
    if (chapterIndices[i] <= index) current = i;
    else break;
  }
  return current;
}

function updateRail() {
  const current = currentChapter();
  const dots = sideRail.querySelectorAll('.dot-wrap');
  dots.forEach((dot, i) => {
    dot.classList.remove('past', 'current', 'future');
    if (i < current) dot.classList.add('past');
    else if (i === current) dot.classList.add('current');
    else dot.classList.add('future');
  });
}

buildRail();

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'BUTTON' && e.key === ' ') return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
});

render();

// Survey widget
(function() {
  const survey = document.getElementById('survey');
  if (!survey) return;

  const STORAGE_KEY = 'oor_survey_v1';
  const FORMSPREE_ENDPOINT = 'https://formspree.io/f/xzdyqagw';

  if (localStorage.getItem(STORAGE_KEY)) {
    survey.hidden = true;
    return;
  }

  // Delay before showing the banner so it doesn't intrude immediately
  setTimeout(() => {
    survey.hidden = false;
    requestAnimationFrame(() => survey.classList.add('visible'));
  }, 18000);

  const state = { q1: null, q2: null };
  const stepQ1 = survey.querySelector('.survey-q1');
  const stepQ2 = survey.querySelector('.survey-q2');
  const stepThanks = survey.querySelector('.survey-thanks');

  survey.addEventListener('click', async (e) => {
    if (e.target.closest('.survey-dismiss')) {
      survey.hidden = true;
      localStorage.setItem(STORAGE_KEY, 'dismissed');
      return;
    }

    const btn = e.target.closest('.survey-btn');
    if (!btn) return;

    const q = btn.dataset.q;
    state['q' + q] = btn.dataset.v;

    if (q === '1') {
      stepQ1.hidden = true;
      stepQ2.hidden = false;
      return;
    }

    // q === '2' — submit and thank
    stepQ2.hidden = true;
    stepThanks.hidden = false;

    let outcome = 'Unknown';
    if (state.q1 === 'yes' && state.q2 === 'yes') outcome = 'Convinced by site';
    else if (state.q1 === 'yes' && state.q2 === 'no') outcome = 'Already convinced';
    else if (state.q1 === 'no' && state.q2 === 'yes') outcome = 'Mind changed — now skeptical';
    else if (state.q1 === 'no' && state.q2 === 'no') outcome = 'Unconvinced';

    try {
      await fetch(FORMSPREE_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({
          _subject: 'On the Record — ' + outcome,
          believed_before: state.q1,
          changed_thinking: state.q2,
          outcome: outcome,
          page: window.location.href,
          timestamp: new Date().toISOString()
        })
      });
    } catch (err) {
      console.warn('Survey submit failed:', err);
    }

    localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state, outcome }));
    setTimeout(() => { survey.hidden = true; }, 3500);
  });
})();
</script>
