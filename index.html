<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>On the Record · Public statements on UAP</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📄</text></svg>">
<meta name="description" content="Eighty public statements from presidents, senators, intelligence directors, generals, and military pilots on unidentified anomalous phenomena. Each quote sourced and linked.">

<!-- Open Graph (Facebook, LinkedIn, iMessage, Slack) -->
<meta property="og:type" content="website">
<meta property="og:title" content="On the Record">
<meta property="og:description" content="Eighty public statements on unidentified anomalous phenomena, from presidents, senators, intelligence directors, and military pilots. Read one at a time.">
<meta property="og:site_name" content="On the Record">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="On the Record">
<meta name="twitter:description" content="Eighty public statements on unidentified anomalous phenomena, from presidents, senators, intelligence directors, and military pilots. Read one at a time.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f2ea;
    --ink: #1A1A1A;
    --muted: #777777;
    --rule: #d4cfc2;
    --fade: 600ms;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Newsreader', Georgia, serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding: 4vh 6vw;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
    opacity: 0;
    transition: opacity var(--fade) ease;
  }

  main.visible { opacity: 1; }

  .screen-inner {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .quote-text {
    font-family: 'Newsreader', Georgia, serif;
    font-size: clamp(2.4rem, 5.5vw, 5rem);
    line-height: 1.1;
    font-weight: 600;
    font-variation-settings: "opsz" 48;
    letter-spacing: -0.015em;
    color: var(--ink);
    margin-bottom: 3.5rem;
    max-width: 1200px;
    text-align: center;
    text-wrap: balance;
  }

  .quote-text.medium {
    font-size: clamp(2.2rem, 4.7vw, 3.9rem);
    line-height: 1.15;
    font-variation-settings: "opsz" 48;
    max-width: 960px;
  }

  .quote-text.long {
    font-size: clamp(1.7rem, 3.6vw, 3rem);
    line-height: 1.25;
    font-variation-settings: "opsz" 48;
    max-width: 1000px;
    text-wrap: balance;
  }

  .quote-text.very-long {
    font-size: clamp(1.35rem, 2.4vw, 2rem);
    line-height: 1.4;
    font-variation-settings: "opsz" 24;
    font-weight: 500;
    letter-spacing: 0;
    max-width: 920px;
    text-wrap: pretty;
  }

  .rule {
    width: 32px;
    height: 1px;
    background: var(--rule);
    margin: 0 auto 1.25rem;
  }

  .attribution {
    font-family: 'Public Sans', -apple-system, sans-serif;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-size: 0.72rem;
    color: var(--ink);
    font-weight: 600;
    margin-bottom: 0.4rem;
    text-align: center;
  }

  .credential {
    font-family: 'Public Sans', -apple-system, sans-serif;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: 0.6rem;
    color: var(--muted);
    font-weight: 400;
    margin-bottom: 0.3rem;
    max-width: 600px;
    line-height: 1.5;
    text-align: center;
  }

  .date {
    font-family: 'Public Sans', -apple-system, sans-serif;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-size: 0.56rem;
    color: var(--muted);
    margin-bottom: 2rem;
    text-align: center;
  }

  .source-link {
    font-family: 'Public Sans', -apple-system, sans-serif;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-size: 0.56rem;
    color: var(--muted);
    text-decoration: none;
    transition: color 200ms;
    display: inline-flex;
    align-items: baseline;
  }

  /* Underline only the word, not the arrow */
  .source-link .verify-word {
    border-bottom: 1px solid var(--rule);
    padding-bottom: 3px;
    transition: border-color 200ms;
  }

  .source-link:hover {
    color: var(--ink);
  }

  .source-link:hover .verify-word {
    border-bottom-color: var(--ink);
  }

  .quote-eyebrow {
    font-family: 'Public Sans', -apple-system, sans-serif;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-size: 0.62rem;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 2.5rem;
    text-align: center;
  }

  .section-frame {
    border: 1px solid var(--rule);
    padding: clamp(3rem, 6vw, 5rem) clamp(2.5rem, 5vw, 4.5rem);
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .section-eyebrow {
    font-family: 'Public Sans', -apple-system, sans-serif;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 2rem;
  }

  .section-title {
    font-family: 'Newsreader', Georgia, serif;
    font-size: clamp(2.6rem, 6vw, 4.8rem);
    font-weight: 600;
    font-variation-settings: "opsz" 48;
    letter-spacing: -0.015em;
    line-height: 1.1;
    color: var(--ink);
    max-width: 1100px;
    text-align: center;
    text-wrap: balance;
  }

  .section-nudge {
    font-family: 'Public Sans', -apple-system, sans-serif;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-size: 0.66rem;
    font-weight: 500;
    color: var(--muted);
    margin-top: 3rem;
    opacity: 0.7;
  }

  /* First-screen pulse on Next button — warm-brown breathing glow */
  .nav-btn.pulse {
    color: var(--ink);
    border-color: var(--ink);
    animation: pulse-glow 2.4s ease-in-out infinite;
  }

  @keyframes pulse-glow {
    0%, 100% {
      box-shadow: 0 0 14px 5px rgba(155, 139, 115, 0.25);
    }
    50% {
      box-shadow: 0 0 28px 12px rgba(155, 139, 115, 0.45);
    }
  }

  .intro-eyebrow {
    font-family: 'Public Sans', -apple-system, sans-serif;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 1.75rem;
    text-align: center;
  }

  .intro-title {
    font-family: 'Newsreader', Georgia, serif;
    font-size: clamp(8rem, 22vw, 20rem);
    font-weight: 600;
    font-variation-settings: "opsz" 72;
    letter-spacing: -0.04em;
    line-height: 0.9;
    margin-bottom: 2.5rem;
    text-align: center;
    text-wrap: balance;
  }

  .intro-sub {
    font-family: 'Newsreader', Georgia, serif;
    font-variation-settings: "opsz" 14;
    font-size: clamp(1.1rem, 1.6vw, 1.4rem);
    font-weight: 400;
    line-height: 1.55;
    color: var(--muted);
    max-width: 720px;
    margin: 0 auto 3rem;
    text-align: center;
    text-wrap: pretty;
  }

  .start-btn {
    font-family: 'Public Sans', -apple-system, sans-serif;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-size: 0.88rem;
    color: var(--ink);
    background: none;
    border: 1px solid var(--ink);
    padding: 1.15rem 2.8rem;
    cursor: pointer;
    transition: all 200ms;
  }

  .start-btn:hover {
    background: var(--ink);
    color: var(--bg);
  }

  .closing-text {
    font-family: 'Newsreader', Georgia, serif;
    font-size: clamp(2rem, 4vw, 3.2rem);
    line-height: 1.25;
    font-weight: 600;
    font-variation-settings: "opsz" 48;
    letter-spacing: -0.012em;
    color: var(--ink);
    margin-bottom: 2.5rem;
    max-width: 1100px;
    text-align: center;
    text-wrap: pretty;
  }

  .closing-sub {
    font-family: 'Newsreader', Georgia, serif;
    font-variation-settings: "opsz" 14;
    font-size: clamp(1rem, 1.3vw, 1.15rem);
    color: var(--muted);
    margin-bottom: 2.5rem;
    max-width: 600px;
    line-height: 1.6;
    text-align: center;
  }

  .closing-link {
    font-family: 'Public Sans', -apple-system, sans-serif;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-size: 0.76rem;
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--ink);
    padding-bottom: 3px;
    transition: opacity 200ms;
  }

  .closing-link:hover { opacity: 0.6; }

  .closing-links {
    display: flex;
    gap: 2.5rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  nav.controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 1100px;
    margin: 0 auto;
    width: 100%;
    padding-top: 1.5rem;
  }

  .nav-btn {
    font-family: 'Public Sans', -apple-system, sans-serif;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-size: 0.7rem;
    font-weight: 500;
    color: var(--muted);
    background: var(--bg);
    border: 1px solid var(--rule);
    border-radius: 2px;
    cursor: pointer;
    padding: 0.75rem 1.5rem;
    transition: all 200ms;
  }

  .nav-btn:hover:not(:disabled) {
    color: var(--ink);
    border-color: var(--ink);
  }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }

  .progress {
    font-family: 'Public Sans', -apple-system, sans-serif;
    letter-spacing: 0.16em;
    font-size: 0.62rem;
    color: var(--muted);
    opacity: 0;
    transition: opacity 300ms;
  }
  .progress.visible { opacity: 0.85; }

  .progress-sep {
    margin: 0 0.45em;
    opacity: 0.55;
  }

  .progress-index {
    color: inherit;
    text-decoration: underline;
    text-underline-offset: 4px;
    text-decoration-thickness: 1px;
    transition: color 200ms;
  }
  .progress-index:hover { color: var(--ink); }

  /* Side rail — chapter map */
  .side-rail {
    position: fixed;
    top: 50%;
    right: clamp(1rem, 2vw, 2rem);
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    z-index: 10;
    padding: 0.5rem;
  }


  /* Survey widget — slim banner pinned to viewport top */
  .survey {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 30;
    background: rgba(26, 26, 26, 0.15);
    color: var(--ink);
    padding: 0.4rem clamp(2.5rem, 5vw, 3rem) 0.4rem clamp(1rem, 4vw, 2rem);
    min-height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    flex-wrap: wrap;
    font-family: 'Public Sans', -apple-system, sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.02em;
    opacity: 0;
    transition: opacity 400ms ease;
  }

  .survey.visible { opacity: 1; }
  .survey[hidden] { display: none; }

  .survey-step {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .survey-step[hidden] { display: none; }

  .survey-prompt {
    color: var(--ink);
    font-weight: 500;
  }

  .survey-btn {
    background: none;
    border: 1px solid rgba(26, 26, 26, 0.25);
    color: var(--ink);
    padding: 0.15rem 0.5rem;
    border-radius: 3px;
    cursor: pointer;
    font-size: 0.85rem;
    line-height: 1;
    transition: all 180ms;
  }

  .survey-btn:hover {
    border-color: var(--ink);
    background: var(--ink);
    color: var(--bg);
  }

  .survey-dismiss {
    position: absolute;
    right: 0.5rem;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    font-size: 1.1rem;
    color: rgba(26, 26, 26, 0.5);
    cursor: pointer;
    line-height: 1;
    padding: 0.15rem 0.5rem;
  }

  .survey-dismiss:hover { color: var(--ink); }

  .arrow {
    width: 0.95em;
    height: 0.95em;
    vertical-align: -0.1em;
    display: inline-block;
    margin-left: 0.35em;
  }
  .arrow.arrow-left { margin-left: 0; margin-right: 0.35em; }

  .dot-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    font: inherit;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
    border: none;
    opacity: 0.35;
    transition: all 220ms ease;
  }

  /* Active chapter: dark */
  .dot-wrap.current .dot {
    background: var(--ink);
    opacity: 1;
  }

  /* Hover: expand into outlined keyline circle */
  .dot-wrap:hover .dot {
    width: 22px;
    height: 22px;
    background: transparent;
    border: 1px solid var(--ink);
    opacity: 1;
  }

  /* Tooltip */
  .dot-tooltip {
    position: absolute;
    right: calc(100% + 12px);
    top: 50%;
    transform: translateY(-50%);
    background: var(--ink);
    color: var(--bg);
    font-family: 'Public Sans', -apple-system, sans-serif;
    font-size: 0.68rem;
    letter-spacing: -0.005em;
    padding: 0.55rem 0.8rem;
    border-radius: 4px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 180ms ease;
  }

  .dot-wrap:hover .dot-tooltip {
    opacity: 1;
  }

  /* Wordmark — top-left, two lines, tight leading */
  .wordmark {
    position: fixed;
    top: clamp(1.25rem, 2.5vh, 2rem);
    left: clamp(1.25rem, 2.5vw, 2rem);
    font-family: 'Public Sans', -apple-system, sans-serif;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: 0.72rem;
    font-weight: 500;
    line-height: 1.05;
    color: var(--ink);
    text-decoration: none;
    z-index: 10;
    transition: opacity 200ms;
  }
  .wordmark:hover { opacity: 0.6; }

  /* Top-right stacked nav */
  .top-nav {
    position: fixed;
    top: clamp(1.25rem, 2.5vh, 2rem);
    right: clamp(1.25rem, 2.5vw, 2rem);
    display: flex;
    flex-direction: column;
    gap: 0.45rem;
    align-items: flex-end;
    z-index: 10;
  }
  .top-nav a {
    font-family: 'Public Sans', -apple-system, sans-serif;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-size: 0.7rem;
    font-weight: 500;
    color: var(--muted);
    text-decoration: underline;
    text-underline-offset: 4px;
    text-decoration-thickness: 1px;
    transition: color 200ms;
  }
  .top-nav a:hover { color: var(--ink); }

  /* Top progress bar — thin, muted, fills with reading progress */
  .progress-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--rule);
    z-index: 20;
    pointer-events: none;
  }
  .progress-bar-fill {
    height: 100%;
    width: 0;
    background: #9B8B73;
    transition: width 320ms ease;
  }

  /* Verify link: ↗ arrow fades in on hover */
  .source-link .verify-arrow {
    display: inline-block;
    width: 0;
    margin-left: 0;
    opacity: 0;
    overflow: hidden;
    vertical-align: -0.05em;
    transition: opacity 220ms ease, width 220ms ease, margin-left 220ms ease;
  }
  .source-link:hover .verify-arrow,
  .source-link:focus-visible .verify-arrow {
    opacity: 1;
    width: 0.8em;
    margin-left: 0.4em;
  }

  /* Hide chapter rail on very narrow screens */
  @media (max-width: 640px) {
    .side-rail { display: none; }
  }

  @media (max-width: 640px) {
    body { padding: 3vh 5vw 5.5rem; }

    /* Lower the floor — long quotes overflow viewport otherwise */
    .quote-text { font-size: clamp(1.6rem, 5.5vw, 5rem); margin-bottom: 2rem; }
    .quote-text.medium { font-size: clamp(1.5rem, 4.7vw, 3.9rem); }
    .quote-text.long { font-size: clamp(1.25rem, 3.6vw, 3rem); }
    .quote-text.very-long { font-size: clamp(1.05rem, 2.4vw, 2rem); }

    .date { margin-bottom: 2rem; }

    /* Fixed bottom nav — sticky was unreliable inside flex on iOS */
    nav.controls {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      max-width: none;
      margin: 0;
      background: var(--bg);
      padding: 0.85rem clamp(1rem, 4vw, 2rem) 0.85rem;
      border-top: 1px solid var(--rule);
      z-index: 15;
    }

    .wordmark { font-size: 0.6rem; letter-spacing: 0.1em; }
    .top-nav a { font-size: 0.6rem; letter-spacing: 0.12em; }
    .top-nav { gap: 0.35rem; }

    .survey {
      flex-direction: column;
      gap: 0.55rem;
      padding-right: 2.5rem;
      font-size: 0.7rem;
      text-align: center;
    }
  }
</style>
</head>
<body>

<div class="progress-bar" aria-hidden="true"><div class="progress-bar-fill" id="progress-bar-fill"></div></div>

<a class="wordmark" href="/" aria-label="Officials on Record — home">OFFICIALS<br>ON RECORD</a>

<nav class="top-nav" aria-label="Site sections">
  <a href="/reading/">Further reading</a>
</nav>

<aside class="survey" id="survey" aria-label="Reader survey" hidden>
  <div class="survey-step survey-q1">
    <span class="survey-prompt">Do you think UAP are a serious topic?</span>
    <button class="survey-btn" data-q="1" data-v="yes" aria-label="Yes">👍</button>
    <button class="survey-btn" data-q="1" data-v="no" aria-label="No">👎</button>
  </div>
  <div class="survey-step survey-q2" hidden>
    <span class="survey-prompt">Has this changed your mind?</span>
    <button class="survey-btn" data-q="2" data-v="yes" aria-label="Yes">👍</button>
    <button class="survey-btn" data-q="2" data-v="no" aria-label="No">👎</button>
  </div>
  <div class="survey-step survey-thanks" hidden>
    <span class="survey-prompt">Thanks for the feedback.</span>
  </div>
  <button class="survey-dismiss" id="survey-dismiss" aria-label="Dismiss survey">×</button>
</aside>

<main id="stage"></main>

<nav class="controls">
  <button class="nav-btn" id="prev-btn"><svg class="arrow arrow-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg>Prev</button>
  <span class="progress" id="progress"></span>
  <button class="nav-btn" id="next-btn">Next <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></button>
</nav>

<aside class="side-rail" id="side-rail" aria-label="Chapter navigation">
  <!-- dots injected by JS -->
</aside>

<script src="/data.js"></script>
<script>
const screens = window.OOR_SCREENS;
const slugs = window.OOR_buildSlugs(screens);

const stage = document.getElementById('stage');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const progress = document.getElementById('progress');
const progressBarFill = document.getElementById('progress-bar-fill');

// Map slug -> screen index (for #hash routing on load and click-to-quote)
const slugToIndex = {};
slugs.forEach((slug, i) => { if (slug) slugToIndex[slug] = i; });

// Boot index from URL hash if present (#rubio-2020-bases → that quote)
let index = 0;
(function bootFromHash() {
  const hash = (window.location.hash || '').replace(/^#/, '');
  if (hash && slugToIndex.hasOwnProperty(hash)) {
    index = slugToIndex[hash];
  }
})();

function render() {
  const s = screens[index];
  stage.classList.remove('visible');

  setTimeout(() => {
    stage.innerHTML = '';

    if (s.type === 'intro') {
      stage.innerHTML = `
        <div class="screen-inner">
          ${s.eyebrow ? `<div class="intro-eyebrow">${s.eyebrow}</div>` : ''}
          <h1 class="intro-title">${s.title}</h1>
          <p class="intro-sub">${s.sub}</p>
          <button class="start-btn" id="start-btn-el">${s.cta}</button>
        </div>
      `;
      document.getElementById('start-btn-el').addEventListener('click', next);
    } else if (s.type === 'section') {
      stage.innerHTML = `
        <div class="screen-inner">
          <div class="section-frame">
            <div class="section-eyebrow">Chapter ${s.eyebrow}</div>
            <h2 class="section-title">${s.title}</h2>
          </div>
        </div>
      `;
    } else if (s.type === 'quote') {
      const len = s.text.length;
      let sizeClass = '';
      if (len > 500) sizeClass = 'very-long';
      else if (len > 250) sizeClass = 'long';
      else if (len > 120) sizeClass = 'medium';
      stage.innerHTML = `
        <div class="screen-inner">
          ${s.eyebrow ? `<div class="quote-eyebrow">${s.eyebrow}</div>` : ''}
          <blockquote class="quote-text ${sizeClass}">&ldquo;${s.text}&rdquo;</blockquote>
          <div class="rule"></div>
          <div class="attribution">${s.speaker}</div>
          <div class="credential">${s.credential}</div>
          <div class="date">${s.date}</div>
          <a class="source-link" href="${s.source}" target="_blank" rel="noopener"><span class="verify-word">Verify</span><svg class="verify-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></a>
        </div>
      `;
    } else if (s.type === 'closing') {
      stage.innerHTML = `
        <div class="screen-inner">
          <p class="closing-text">${s.text}</p>
          <p class="closing-sub">${s.sub}</p>
          <div class="closing-links">
            <a class="closing-link" href="${s.linkUrl}" target="_blank" rel="noopener">${s.linkText}</a>
            <a class="closing-link" href="${s.readingUrl}">${s.readingText}<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"/><path d="M9 7h8v8"/></svg></a>
          </div>
        </div>
      `;
    }

    stage.classList.add('visible');
    updateControls();
    window.scrollTo(0, 0);
  }, 250);
}

function updateControls() {
  const s = screens[index];
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === screens.length - 1;

  if (s.type === 'quote') {
    const quoteScreens = screens.filter(x => x.type === 'quote');
    const currentQuoteIndex = screens.slice(0, index + 1).filter(x => x.type === 'quote').length;
    progress.innerHTML = `${currentQuoteIndex} / ${quoteScreens.length} <span class="progress-sep">·</span> <a class="progress-index" href="/all/">Index</a>`;
    progress.classList.add('visible');
    window.dispatchEvent(new CustomEvent('quoteViewed', { detail: currentQuoteIndex }));
  } else {
    progress.innerHTML = `<a class="progress-index" href="/all/">Index</a>`;
    progress.classList.add('visible');
  }

  // Pulse the Next button only on the first screen
  if (index === 0) nextBtn.classList.add('pulse');
  else nextBtn.classList.remove('pulse');

  updateRail();
  updateProgressBar();
  updateHash();
}

// Top progress bar — fills with overall position through the deck
function updateProgressBar() {
  if (!progressBarFill) return;
  const pct = ((index + 1) / screens.length) * 100;
  progressBarFill.style.width = pct + '%';
}

// Update URL hash to current quote slug (no scroll, no history pollution)
function updateHash() {
  const slug = slugs[index];
  if (slug) {
    history.replaceState(null, '', '#' + slug);
  } else if (window.location.hash) {
    // Section/intro/closing screens — strip hash
    history.replaceState(null, '', window.location.pathname + window.location.search);
  }
}

function next() {
  if (index < screens.length - 1) { index++; render(); }
}

function prev() {
  if (index > 0) { index--; render(); }
}

prevBtn.addEventListener('click', prev);
nextBtn.addEventListener('click', next);

// --- Side rail (chapter map) ---
const sideRail = document.getElementById('side-rail');

// Find indices of each section (chapter) screen
const chapterIndices = screens
  .map((s, i) => (s.type === 'section' ? i : -1))
  .filter(i => i !== -1);

// Build the dots once
function buildRail() {
  sideRail.innerHTML = '';
  chapterIndices.forEach((screenIdx, chapterNum) => {
    const s = screens[screenIdx];
    const wrap = document.createElement('button');
    wrap.className = 'dot-wrap';
    wrap.dataset.index = screenIdx;
    wrap.setAttribute('aria-label', `Jump to Chapter ${s.eyebrow}: ${s.title}`);
    wrap.innerHTML = `
      <span class="dot"></span>
      <span class="dot-tooltip">${s.title.replace(/\.$/, '')}</span>
    `;
    wrap.addEventListener('click', () => {
      index = screenIdx;
      render();
    });
    sideRail.appendChild(wrap);
  });
}

// Figure out which chapter the current screen belongs to
function currentChapter() {
  // The current chapter is the largest chapter-start index <= index
  let current = 0;
  for (let i = 0; i < chapterIndices.length; i++) {
    if (chapterIndices[i] <= index) current = i;
    else break;
  }
  return current;
}

function updateRail() {
  const current = currentChapter();
  const dots = sideRail.querySelectorAll('.dot-wrap');
  dots.forEach((dot, i) => {
    dot.classList.remove('past', 'current', 'future');
    if (i < current) dot.classList.add('past');
    else if (i === current) dot.classList.add('current');
    else dot.classList.add('future');
  });
}

buildRail();

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'BUTTON' && e.key === ' ') return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
});

// Browser back/forward through hash history
window.addEventListener('hashchange', () => {
  const hash = (window.location.hash || '').replace(/^#/, '');
  if (hash && slugToIndex.hasOwnProperty(hash) && slugToIndex[hash] !== index) {
    index = slugToIndex[hash];
    render();
  }
});

render();

// Survey widget
(function() {
  const survey = document.getElementById('survey');
  if (!survey) return;

  const STORAGE_KEY = 'oor_survey_v3';
  const FORMSPREE_ENDPOINT = 'https://formspree.io/f/xzdyqagw';

  if (localStorage.getItem(STORAGE_KEY)) {
    survey.hidden = true;
    return;
  }

  // Show the banner once the reader has advanced through 5 statements
  const SHOW_AFTER_QUOTES = 5;
  let shown = false;
  window.addEventListener('quoteViewed', (e) => {
    if (shown) return;
    if (e.detail < SHOW_AFTER_QUOTES) return;
    shown = true;
    survey.hidden = false;
    requestAnimationFrame(() => survey.classList.add('visible'));
  });

  const state = { q1: null, q2: null };
  const stepQ1 = survey.querySelector('.survey-q1');
  const stepQ2 = survey.querySelector('.survey-q2');
  const stepThanks = survey.querySelector('.survey-thanks');

  survey.addEventListener('click', async (e) => {
    if (e.target.closest('.survey-dismiss')) {
      survey.hidden = true;
      localStorage.setItem(STORAGE_KEY, 'dismissed');
      return;
    }

    const btn = e.target.closest('.survey-btn');
    if (!btn) return;

    const q = btn.dataset.q;
    state['q' + q] = btn.dataset.v;

    if (q === '1') {
      stepQ1.hidden = true;
      stepQ2.hidden = false;
      return;
    }

    // q === '2' — submit and thank
    stepQ2.hidden = true;
    stepThanks.hidden = false;

    let outcome = 'Unknown';
    if (state.q1 === 'yes' && state.q2 === 'yes') outcome = 'Convinced by site';
    else if (state.q1 === 'yes' && state.q2 === 'no') outcome = 'Already convinced';
    else if (state.q1 === 'no' && state.q2 === 'yes') outcome = 'Mind changed — now skeptical';
    else if (state.q1 === 'no' && state.q2 === 'no') outcome = 'Unconvinced';

    try {
      await fetch(FORMSPREE_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({
          _subject: 'On the Record — ' + outcome,
          believed_before: state.q1,
          changed_thinking: state.q2,
          outcome: outcome,
          page: window.location.href,
          timestamp: new Date().toISOString()
        })
      });
    } catch (err) {
      console.warn('Survey submit failed:', err);
    }

    localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state, outcome }));
    setTimeout(() => { survey.hidden = true; }, 3500);
  });
})();
</script>
